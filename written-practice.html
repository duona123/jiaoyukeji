  <script src="assets/js/practice-core.js"></script>
  <script>
  /* =======================================================================
     笔试练习页（独立页面）
     —— 数据来源：assets/js/practice-core.js（buildWritten / resolvePlan / getProg / setProg 等）
     —— 进度回写到同一 localStorage（practice-progress[planId]），与练习中心自动同步
     ======================================================================= */
  var state = {
    plan: null,
    written: [],
    papers: [],
    view: 'list',            /* 'list' | 'quiz' */
    paperKey: null,          /* 当前试卷 key = school|major */
    paperList: [],           /* 当前试卷的题目 */
    qIndex: 0,               /* 当前题在试卷内的下标 */
    search: '',
    schoolFilter: 'all',
    selected: [],
    submitted: false
  };

  /* ---- 分组：一份试卷 = 方案中的一个「院校 · 专业」 ---- */
  function groupPapers() {
    var map = {}, order = [];
    state.written.forEach(function (q) {
      var key = q.school + '|' + q.major;
      if (!map[key]) { map[key] = { key: key, school: q.school, major: q.major, questions: [] }; order.push(key); }
      map[key].questions.push(q);
    });
    return order.map(function (k) { return map[k]; });
  }
  function paperByKey(key) {
    return state.papers.filter(function (p) { return p.key === key; })[0] || null;
  }
  function answeredOf(prog) { return prog.answered || {}; }

  /* ---- 试卷级进度 / 正确率（基于 answered 明细） ---- */
  function paperStats(paper) {
    var ans = answeredOf(getProg(state.plan.id));
    var total = paper.questions.length, answered = 0, correct = 0;
    paper.questions.forEach(function (q) {
      var v = ans[q.id];
      if (v) { answered++; if (v === 'correct') correct++; }
    });
    return { total: total, answered: answered, correct: correct, rate: answered ? Math.round(correct / answered * 100) : 0 };
  }

  /* ---- 整体汇总 ---- */
  function overallStats() {
    var ans = answeredOf(getProg(state.plan.id));
    var ids = Object.keys(ans);
    var correct = ids.filter(function (id) { return ans[id] === 'correct'; }).length;
    return { papers: state.papers.length, total: state.written.length, done: ids.length, correct: correct, rate: ids.length ? Math.round(correct / ids.length * 100) : 0 };
  }

  /* ---- 搜索 + 院校筛选后的试卷 ---- */
  function visiblePapers() {
    var kw = state.search.trim().toLowerCase();
    return state.papers.filter(function (p) {
      if (state.schoolFilter !== 'all' && p.school !== state.schoolFilter) return false;
      if (!kw) return true;
      return p.school.toLowerCase().indexOf(kw) >= 0 || String(p.major || '').toLowerCase().indexOf(kw) >= 0;
    });
  }

  /* ---- 当前方案信息条 ---- */
  function renderPlanBar() {
    var p = state.plan;
    document.getElementById('wp-plan-bar').innerHTML = '' +
      '<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 p-5 rounded-2xl border border-edu-border bg-edu-card shadow-sm">' +
        '<div class="flex items-center gap-4 min-w-0">' +
          '<div class="w-12 h-12 rounded-xl bg-edu-primary-50 text-edu-primary flex items-center justify-center shrink-0"><i data-lucide="book-open-check" class="w-6 h-6"></i></div>' +
          '<div class="min-w-0">' +
            '<div class="flex items-center gap-2 flex-wrap">' +
              '<p class="font-semibold text-edu-foreground truncate">' + esc(p.name) + '</p>' +
              '<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-edu-primary-50 text-edu-primary-700">' + esc(p.planType) + '</span>' +
              (p.real ? '' : '<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-edu-muted text-edu-muted-foreground">示例方案</span>') +
            '</div>' +
            '<p class="edu-caption text-edu-muted-foreground mt-1">共 ' + p.majors.length + ' 条志愿 · 笔试 ' + state.written.length + ' 题</p>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center gap-2 shrink-0">' +
          '<a href="question-bank.html" class="inline-flex items-center gap-1.5 px-4 h-10 rounded-lg border border-edu-border text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i>返回练习中心</a>' +
        '</div>' +
      '</div>';
  }

  function statBox(label, value) {
    return '<div class="rounded-xl bg-edu-muted p-4"><p class="text-xs text-edu-muted-foreground">' + label + '</p><p class="text-xl font-semibold text-edu-foreground edu-number">' + value + '</p></div>';
  }

  /* ---- 视图 A：试卷列表 ---- */
  function renderListView() {
    var o = overallStats();
    var schools = [];
    state.written.forEach(function (q) { if (schools.indexOf(q.school) < 0) schools.push(q.school); });
    var schoolOpts = '<option value="all">全部院校</option>' + schools.map(function (s) {
      return '<option value="' + esc(s) + '"' + (s === state.schoolFilter ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');

    document.getElementById('wp-list-head').innerHTML = '' +
      '<div class="flex items-center gap-2 mb-4">' +
        '<i data-lucide="pencil" class="w-5 h-5 text-edu-primary"></i>' +
        '<h1 class="edu-h2 text-edu-foreground">笔试练习</h1>' +
        '<span class="text-xs text-edu-muted-foreground bg-edu-muted px-2 py-0.5 rounded-full">一份试卷 = 一个院校 · 专业</span>' +
      '</div>' +
      '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">' +
        statBox('试卷总数', o.papers) +
        statBox('题目总数', o.total) +
        statBox('已完成', o.done) +
        statBox('总体正确率', o.done ? o.rate + '%' : '--') +
      '</div>' +
      '<div class="bg-edu-card border border-edu-border rounded-xl p-4 md:p-5 shadow-sm">' +
        '<div class="flex flex-col sm:flex-row sm:items-center gap-3">' +
          '<div class="relative flex-1">' +
            '<i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-edu-muted-foreground"></i>' +
            '<input id="wp-search" type="text" value="' + esc(state.search) + '" placeholder="搜索院校 / 专业" class="w-full h-11 pl-10 pr-3 rounded-lg border border-edu-border bg-edu-background text-sm text-edu-foreground focus:outline-none focus:ring-2 focus:ring-edu-primary/30">' +
          '</div>' +
          '<div class="sm:w-56"><select data-paper-school class="w-full h-11 pl-3 pr-8 rounded-lg border border-edu-border bg-edu-background text-sm text-edu-foreground focus:outline-none focus:ring-2 focus:ring-edu-primary/30 appearance-none cursor-pointer">' + schoolOpts + '</select></div>' +
        '</div>' +
      '</div>';

    document.getElementById('wp-search').addEventListener('input', function () {
      state.search = this.value;
      renderPaperGrid();
      refreshIcons();
    });
    document.querySelector('#wp-list-head select[data-paper-school]').addEventListener('change', function () {
      state.schoolFilter = this.value;
      renderPaperGrid();
      refreshIcons();
    });

    renderPaperGrid();
    renderWpExtras();
  }

  /* ---- 试卷卡片网格 ---- */
  function renderPaperGrid() {
    var grid = document.getElementById('wp-paper-grid');
    var list = visiblePapers();
    if (!state.written.length) {
      grid.innerHTML = '<div class="bg-edu-card border border-edu-border rounded-xl p-12 text-center shadow-sm">' +
        '<div class="w-14 h-14 mx-auto rounded-2xl bg-edu-primary-50 text-edu-primary flex items-center justify-center mb-4"><i data-lucide="video" class="w-7 h-7"></i></div>' +
        '<p class="edu-h3 text-edu-foreground">本方案无笔试环节</p>' +
        '<p class="edu-body-sm text-edu-muted-foreground mt-2 max-w-md mx-auto">该方案的院校校测仅包含面试，不需要准备笔试内容。你可以前往 AI 面试练习页面开始模拟面试训练。</p>' +
        '<a href="interview-practice.html" target="_blank" rel="noopener" class="mt-5 inline-flex items-center gap-1.5 px-5 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors"><i data-lucide="video" class="w-4 h-4"></i>前往 AI 面试练习</a>' +
        '</div>';
      refreshIcons();
      return;
    }
    if (!list.length) {
      grid.innerHTML = '<div class="bg-edu-card border border-edu-border rounded-xl p-12 text-center shadow-sm">' +
        '<div class="w-12 h-12 mx-auto rounded-full bg-edu-muted flex items-center justify-center mb-3"><i data-lucide="search-x" class="w-6 h-6 text-edu-muted-foreground"></i></div>' +
        '<p class="text-sm text-edu-foreground font-medium">没有找到匹配的试卷</p>' +
        '<p class="edu-caption text-edu-muted-foreground mt-1">试试更换关键词，或清空搜索与院校筛选。</p>' +
        '</div>';
      refreshIcons();
      return;
    }

    grid.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">' + list.map(function (p) {
      var st = paperStats(p);
      var pct = st.total ? Math.round(st.answered / st.total * 100) : 0;
      var subjects = [];
      p.questions.forEach(function (q) { if (subjects.indexOf(q.subject) < 0) subjects.push(q.subject); });
      var subjectTags = subjects.slice(0, 4).map(function (s) {
        return '<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-edu-primary-50 text-edu-primary-700">' + esc(s) + '</span>';
      }).join('');
      var btnLabel = st.answered >= st.total ? '重新练习' : (st.answered > 0 ? '继续练习' : '开始练习');
      return '' +
        '<div class="bg-edu-card border border-edu-border rounded-2xl p-5 shadow-sm flex flex-col hover:border-edu-primary/40 transition-colors">' +
          '<div class="flex items-start gap-3">' +
            '<div class="w-10 h-10 rounded-xl bg-edu-primary-50 text-edu-primary flex items-center justify-center shrink-0"><i data-lucide="file-text" class="w-5 h-5"></i></div>' +
            '<div class="min-w-0 flex-1">' +
              '<h3 class="edu-h3 text-edu-foreground truncate">' + esc(p.school) + ' · ' + esc(p.major || '校测') + '</h3>' +
              '<div class="mt-1.5 flex flex-wrap items-center gap-1.5">' +
                '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-edu-muted text-edu-muted-foreground">' + st.total + ' 题</span>' +
                '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-edu-state-info-bg text-edu-state-info">来源：校测题库</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          (subjectTags ? '<div class="mt-3 flex flex-wrap gap-1.5">' + subjectTags + '</div>' : '') +
          '<div class="mt-4">' +
            '<div class="flex items-center justify-between mb-1.5">' +
              '<span class="edu-caption text-edu-muted-foreground">已完成 ' + st.answered + ' / 共 ' + st.total + ' 题</span>' +
              '<span class="edu-caption ' + (st.answered ? 'text-edu-foreground font-medium' : 'text-edu-muted-foreground') + '">正确率 ' + (st.answered ? st.rate + '%' : '--') + '</span>' +
            '</div>' +
            '<div class="h-2.5 w-full rounded-full bg-edu-muted overflow-hidden"><div class="h-full rounded-full bg-edu-primary" style="width:' + pct + '%"></div></div>' +
          '</div>' +
          '<button type="button" data-paper="' + esc(p.key) + '" class="mt-4 w-full inline-flex items-center justify-center gap-1.5 px-4 h-10 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors">' +
            '<i data-lucide="' + (st.answered > 0 ? 'play' : 'pencil') + '" class="w-4 h-4"></i>' + btnLabel +
          '</button>' +
        '</div>';
    }).join('') + '</div>';

    grid.querySelectorAll('button[data-paper]').forEach(function (btn) {
      btn.addEventListener('click', function () { enterPaper(this.dataset.paper, null); });
    });
    refreshIcons();
  }

  /* ---- 视图 B：正式练习 ---- */
  function currentQ() { return state.paperList[state.qIndex]; }

  function renderQuizHead() {
    var paper = paperByKey(state.paperKey);
    var q = currentQ();
    document.getElementById('wp-quiz-head').innerHTML = '' +
      '<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 p-5 rounded-2xl border border-edu-border bg-edu-card shadow-sm">' +
        '<div class="flex items-center gap-4 min-w-0">' +
          '<div class="w-12 h-12 rounded-xl bg-edu-primary-50 text-edu-primary flex items-center justify-center shrink-0"><i data-lucide="file-text" class="w-6 h-6"></i></div>' +
          '<div class="min-w-0">' +
            '<p class="font-semibold text-edu-foreground truncate">' + (paper ? esc(paper.school) + ' · ' + esc(paper.major || '校测') : '试卷练习') + '</p>' +
            '<p class="edu-caption text-edu-muted-foreground mt-1">第 <span class="edu-number text-edu-foreground font-medium">' + (state.qIndex + 1) + '</span> 题 / 共 <span class="edu-number text-edu-foreground font-medium">' + state.paperList.length + '</span> 题' + (q && q.school ? ' · 来源：' + esc(q.school) + ' 校测题库' : '') + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="shrink-0">' +
          '<button type="button" onclick="backToList()" class="inline-flex items-center gap-1.5 px-4 h-10 rounded-lg border border-edu-border text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i>返回试卷列表</button>' +
        '</div>' +
      '</div>';
  }

  function renderQuizView() {
    renderQuizHead();
    renderQuestionBox();
  }

  /* ---- 题目卡片 ---- */
  function renderQuestionBox() {
    var box = document.getElementById('written-question-box');
    if (!box) return;
    var list = state.paperList;
    if (!list.length) {
      box.innerHTML = '<div class="bg-edu-card border border-edu-border rounded-xl p-10 text-center"><div class="w-12 h-12 mx-auto rounded-full bg-edu-muted flex items-center justify-center mb-3"><i data-lucide="search-x" class="w-6 h-6 text-edu-muted-foreground"></i></div><p class="text-sm text-edu-muted-foreground">该试卷暂无题目。</p></div>';
      refreshIcons();
      return;
    }
    if (state.qIndex >= list.length) state.qIndex = 0;
    var q = list[state.qIndex];
    var prog = getProg(state.plan.id);
    var fav = (prog.fav || []).indexOf(q.id) >= 0;
    var isMulti = q.type === 'multi';
    var typeLabel = isMulti ? '多选题' : '单选题';
    var diffLabel = q.difficulty === '易' ? '简单' : (q.difficulty === '难' ? '困难' : '中等');
    var st = paperStats(paperByKey(state.paperKey) || { questions: list });

    var optionsHtml = q.options.map(function (o) {
      var checked = state.selected.indexOf(o.k) >= 0;
      var stateCls = 'border-edu-border bg-edu-background hover:border-edu-primary/40';
      if (state.submitted) {
        if (q.answer.indexOf(o.k) >= 0) stateCls = 'border-edu-state-success bg-edu-state-success-bg';
        else if (checked) stateCls = 'border-edu-state-error bg-edu-state-error-bg';
      } else if (checked) {
        stateCls = 'border-edu-primary bg-edu-primary-50';
      }
      return '' +
        '<label class="group flex items-start gap-4 p-4 rounded-xl border ' + stateCls + ' transition-colors ' + (state.submitted ? '' : 'cursor-pointer') + '">' +
          '<span class="mt-0.5 w-6 h-6 ' + (isMulti ? 'rounded-md' : 'rounded-full') + ' border-2 border-edu-border bg-edu-card flex items-center justify-center text-xs font-semibold text-edu-muted-foreground shrink-0">' + o.k + '</span>' +
          '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="qopt" value="' + o.k + '" class="sr-only" ' + (checked ? 'checked' : '') + ' ' + (state.submitted ? 'disabled' : '') + '>' +
          '<span class="flex-1 edu-body text-edu-foreground">' + esc(o.t) + '</span>' +
          (state.submitted && q.answer.indexOf(o.k) >= 0 ? '<i data-lucide="check" class="w-5 h-5 text-edu-state-success shrink-0"></i>' : '') +
        '</label>';
    }).join('');

    var correct = state.selected.slice().sort().join(',') === q.answer.slice().sort().join(',');
    var feedbackHtml = '';
    if (state.submitted) {
      feedbackHtml = '' +
        '<div class="mt-6 rounded-xl border p-5 ' + (correct ? 'border-edu-state-success bg-edu-state-success-bg' : 'border-edu-state-error bg-edu-state-error-bg') + '">' +
          '<div class="flex items-start gap-3 mb-3">' +
            '<div class="w-6 h-6 rounded-full ' + (correct ? 'bg-edu-state-success' : 'bg-edu-state-error') + ' text-white flex items-center justify-center shrink-0">' +
              '<i data-lucide="' + (correct ? 'check' : 'x') + '" class="w-4 h-4"></i>' +
            '</div>' +
            '<div>' +
              '<p class="font-semibold text-edu-foreground">' + (correct ? '回答正确' : '回答错误') + '</p>' +
              '<p class="edu-body-sm text-edu-muted-foreground mt-0.5">正确答案：<span class="font-medium text-edu-state-success">' + q.answer.join('、') + '</span>　你的作答：<span class="font-medium ' + (correct ? 'text-edu-state-success' : 'text-edu-state-error') + '">' + (state.selected.length ? state.selected.join('、') : '未作答') + '</span></p>' +
            '</div>' +
          '</div>' +
          '<div class="pl-9 space-y-3">' +
            '<div><p class="text-sm font-semibold text-edu-foreground mb-1">详细解析</p><p class="edu-body-sm text-edu-muted-foreground leading-relaxed">' + esc(q.analysis) + '</p></div>' +
            '<div><p class="text-sm font-semibold text-edu-foreground mb-1">解题思路</p><p class="edu-body-sm text-edu-muted-foreground leading-relaxed">' + esc(q.tips) + '</p></div>' +
          '</div>' +
        '</div>';
    }

    var submitBtn = state.submitted
      ? '<button type="button" onclick="resetQuestion()" class="px-6 h-11 rounded-lg border border-edu-border bg-edu-card text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors">重做本题</button>'
      : '<button type="button" onclick="submitAnswer()" class="px-6 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors">提交答案</button>';

    box.innerHTML = '' +
      '<div class="bg-edu-card border border-edu-border rounded-xl p-6 md:p-8 shadow-sm">' +
        '<div class="flex flex-wrap items-center gap-3 mb-5">' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-primary-50 text-edu-primary-700 text-xs font-medium"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>' + esc(q.subject) + '</span>' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="layers" class="w-3.5 h-3.5"></i>' + typeLabel + '</span>' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i>' + diffLabel + '</span>' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-state-info-bg text-edu-state-info text-xs font-medium"><i data-lucide="school" class="w-3.5 h-3.5"></i>' + esc(q.school) + '</span>' +
          (q.major ? '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium">' + esc(q.major) + '</span>' : '') +
          '<button type="button" onclick="toggleFav()" class="ml-auto inline-flex items-center gap-1 text-xs font-medium ' + (fav ? 'text-edu-state-warning' : 'text-edu-muted-foreground hover:text-edu-primary') + ' transition-colors"><i data-lucide="star" class="w-4 h-4" ' + (fav ? 'fill="currentColor"' : '') + '></i>' + (fav ? '已收藏' : '收藏') + '</button>' +
          '<span class="edu-caption text-edu-muted-foreground">第 <span class="edu-number text-edu-foreground font-medium">' + (state.qIndex + 1) + '</span> 题 / 共 <span class="edu-number text-edu-foreground font-medium">' + list.length + '</span> 题</span>' +
        '</div>' +
        '<h3 class="edu-h3 text-edu-foreground mb-3">【' + typeLabel + '】' + esc(q.stem) + '</h3>' +
        (isMulti ? '<p class="edu-caption text-edu-muted-foreground mb-3">多选题：请选出所有正确选项。</p>' : '') +
        '<div class="space-y-3 mb-6">' + optionsHtml + '</div>' +
        '<div class="flex items-center gap-3 mb-6">' + submitBtn +
          (!state.submitted ? '<span class="edu-caption text-edu-muted-foreground">作答后点击提交查看解析</span>' : '') +
        '</div>' +
        feedbackHtml +
        '<div class="mt-6 flex flex-wrap gap-2">' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="tag" class="w-3.5 h-3.5"></i>来源：' + esc(q.school) + ' · ' + esc(q.major || '校测') + ' 题库</span>' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="calendar" class="w-3.5 h-3.5"></i>入库时间：2026-01-15</span>' +
        '</div>' +
      '</div>' +
      '<div class="mt-6 bg-edu-card border border-edu-border rounded-xl p-5 md:p-6 shadow-sm">' +
        '<div class="flex flex-col md:flex-row md:items-center gap-5">' +
          '<div class="flex-1">' +
            '<div class="flex items-center justify-between mb-2"><span class="text-sm font-medium text-edu-foreground">本试卷进度</span><span class="text-sm text-edu-muted-foreground"><span class="edu-number font-semibold text-edu-primary">' + st.answered + '</span> / <span class="edu-number">' + st.total + '</span> 题</span></div>' +
            '<div class="h-2.5 w-full rounded-full bg-edu-muted overflow-hidden"><div class="h-full rounded-full bg-edu-primary" style="width:' + (st.total ? Math.round(st.answered / st.total * 100) : 0) + '%"></div></div>' +
          '</div>' +
          '<div class="flex items-center gap-3">' +
            '<button type="button" onclick="prevQuestion()" class="px-5 h-11 rounded-lg border border-edu-border bg-edu-card text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i>上一题</button>' +
            '<button type="button" onclick="nextQuestion()" class="px-5 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors inline-flex items-center gap-1.5">下一题<i data-lucide="arrow-right" class="w-4 h-4"></i></button>' +
          '</div>' +
        '</div>' +
      '</div>';

    box.querySelectorAll('input[name="qopt"]').forEach(function (input) {
      input.addEventListener('change', function () {
        var v = this.value;
        if (isMulti) {
          var idx = state.selected.indexOf(v);
          if (idx >= 0) state.selected.splice(idx, 1); else state.selected.push(v);
        } else {
          state.selected = [v];
        }
        // 单选即时高亮，多选也即时高亮
        renderQuestionBox();
        refreshIcons();
      });
    });
    refreshIcons();
  }

  function submitAnswer() {
    if (!state.selected.length) { alert('请先选择答案'); return; }
    var q = currentQ();
    if (!q) return;
    var correct = state.selected.slice().sort().join(',') === q.answer.slice().sort().join(',');
    state.submitted = true;

    /* 写入 answered 明细，并据此重算聚合字段（保持与练习中心字段名/语义一致） */
    var prog = getProg(state.plan.id);
    var answered = prog.answered || {};
    answered[q.id] = correct ? 'correct' : 'wrong';
    prog.answered = answered;
    var ids = Object.keys(answered);
    prog.done = ids.length;
    prog.correct = ids.filter(function (id) { return answered[id] === 'correct'; }).length;
    prog.wrong = ids.filter(function (id) { return answered[id] === 'wrong'; });
    setProg(state.plan.id, prog);

    renderQuizView();
  }

  function resetQuestion() {
    state.submitted = false;
    state.selected = [];
    renderQuizView();
  }

  function goToIndex(i) {
    var list = state.paperList;
    if (!list.length) return;
    state.qIndex = (i + list.length) % list.length;
    state.selected = [];
    state.submitted = false;
    renderQuizView();
  }
  function prevQuestion() { goToIndex(state.qIndex - 1); }
  function nextQuestion() { goToIndex(state.qIndex + 1); }

  function toggleFav() {
    var q = currentQ();
    if (!q) return;
    var prog = getProg(state.plan.id);
    prog.fav = prog.fav || [];
    var idx = prog.fav.indexOf(q.id);
    if (idx >= 0) prog.fav.splice(idx, 1); else prog.fav.push(q.id);
    setProg(state.plan.id, prog);
    renderQuizView();
  }

  /* ---- 进入某份试卷练习：优先定位到第一道未答题 ---- */
  function enterPaper(key, qid) {
    var paper = paperByKey(key);
    if (!paper) { setView('list'); return; }
    state.paperKey = key;
    state.paperList = paper.questions.slice();
    var idx = 0;
    if (qid) {
      var i = state.paperList.map(function (q) { return q.id; }).indexOf(qid);
      if (i >= 0) idx = i;
    } else {
      var ans = answeredOf(getProg(state.plan.id));
      var fi = -1;
      for (var j = 0; j < state.paperList.length; j++) {
        if (!ans[state.paperList[j].id]) { fi = j; break; }
      }
      idx = fi >= 0 ? fi : 0;
    }
    state.qIndex = idx;
    state.selected = [];
    state.submitted = false;
    setView('quiz');
  }

  /* ---- 视图切换 + URL 同步 ---- */
  function setView(v) {
    state.view = v;
    document.getElementById('wp-list-view').classList.toggle('hidden', v !== 'list');
    document.getElementById('wp-quiz-view').classList.toggle('hidden', v !== 'quiz');
    if (v === 'list') renderListView(); else renderQuizView();
    syncURL();
    refreshIcons();
  }
  function backToList() {
    state.paperKey = null;
    state.paperList = [];
    state.qIndex = 0;
    state.selected = [];
    state.submitted = false;
    setView('list');
  }
  function syncURL() {
    var params = new URLSearchParams(location.search);
    params.delete('q');
    if (state.view === 'quiz' && state.paperKey) {
      params.set('view', 'quiz');
      params.set('paper', state.paperKey);
    } else {
      params.set('view', 'list');
      params.delete('paper');
    }
    var qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }

  /* =======================================================================
     错题本 / 题目收藏 / 智能推荐
     —— 原在练习中心首页展示，现统一收进笔试练习页（本页）
     ======================================================================= */
  function renderWpExtras() {
    renderWpWrongArea();
    renderWpFavArea();
    renderWpSmartArea();
  }

  /* 在本页内进入该题所属试卷并定位到该题 */
  function wpPracticeQuestion(id) {
    var q = state.written.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    enterPaper(q.school + '|' + q.major, id);
  }
  function wpShowAnalysis(id) {
    var q = state.written.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    alert('【' + (q.type === 'multi' ? '多选题' : '单选题') + '】' + q.stem + '\n\n正确答案：' + q.answer.join('、') + '\n\n解析：' + q.analysis + '\n\n思路：' + q.tips);
  }

  /* ---- 错题本 ---- */
  function renderWpWrongArea() {
    var prog = getProg(state.plan.id);
    var ids = prog.wrong || [];
    var items = ids.map(function (id) { return state.written.filter(function (q) { return q.id === id; })[0]; }).filter(Boolean);
    var body;
    if (!items.length) {
      body = '<div class="p-8 text-center"><div class="w-12 h-12 mx-auto rounded-full bg-edu-muted flex items-center justify-center mb-3"><i data-lucide="check-circle-2" class="w-6 h-6 text-edu-state-success"></i></div><p class="text-sm text-edu-muted-foreground">暂无错题，继续保持！答错的题目会自动收录到这里。</p></div>';
    } else {
      body = '<div class="space-y-3">' + items.map(function (q) {
        return '' +
          '<div class="flex flex-col md:flex-row md:items-center justify-between gap-3 p-4 rounded-xl border border-edu-border bg-edu-background hover:border-edu-primary/40 transition-colors">' +
            '<div class="flex-1 min-w-0">' +
              '<div class="flex items-center gap-2 mb-1">' +
                '<span class="px-2 py-0.5 rounded text-[11px] font-medium bg-edu-state-error-bg text-edu-state-error">' + esc(q.subject) + '</span>' +
                '<span class="text-xs text-edu-muted-foreground">' + (q.type === 'multi' ? '多选题' : '单选题') + ' · ' + esc(q.difficulty) + ' · ' + esc(q.school) + '</span>' +
              '</div>' +
              '<p class="text-sm text-edu-foreground font-medium line-clamp-2">' + esc(q.stem) + '</p>' +
            '</div>' +
            '<div class="flex items-center gap-2 shrink-0">' +
              '<button type="button" onclick="wpPracticeQuestion(\'' + esc(q.id) + '\')" class="px-3 h-8 rounded-lg border border-edu-border bg-white text-xs font-medium text-edu-foreground hover:bg-edu-muted transition-colors">重新练习</button>' +
              '<button type="button" onclick="wpShowAnalysis(\'' + esc(q.id) + '\')" class="px-3 h-8 rounded-lg bg-edu-primary text-white text-xs font-medium hover:bg-[#0f766e] transition-colors">查看解析</button>' +
            '</div>' +
          '</div>';
      }).join('') + '</div>';
    }
    document.getElementById('wp-wrong-area').innerHTML = '' +
      '<div class="bg-edu-card border border-edu-border rounded-2xl p-5 md:p-6 shadow-sm">' +
        '<div class="flex items-center gap-2 mb-6">' +
          '<div class="w-8 h-8 rounded-lg bg-edu-state-error-bg text-edu-state-error flex items-center justify-center"><i data-lucide="book-x" class="w-4 h-4"></i></div>' +
          '<h2 class="edu-h3 text-edu-foreground">错题本</h2>' +
          '<span class="text-xs text-edu-muted-foreground bg-edu-muted px-2 py-0.5 rounded-full">共 ' + items.length + ' 道</span>' +
        '</div>' + body +
      '</div>';
  }

  /* ---- 题目收藏 ---- */
  function renderWpFavArea() {
    var prog = getProg(state.plan.id);
    var ids = prog.fav || [];
    var items = ids.map(function (id) { return state.written.filter(function (q) { return q.id === id; })[0]; }).filter(Boolean);
    var body;
    if (!items.length) {
      body = '<div class="p-8 text-center"><div class="w-12 h-12 mx-auto rounded-full bg-edu-muted flex items-center justify-center mb-3"><i data-lucide="star" class="w-6 h-6 text-edu-muted-foreground"></i></div><p class="text-sm text-edu-muted-foreground">还没有收藏的题目，练习时点击题目卡右上角「收藏」即可加入。</p></div>';
    } else {
      body = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + items.map(function (q) {
        return '' +
          '<div onclick="wpPracticeQuestion(\'' + esc(q.id) + '\')" class="cursor-pointer p-4 rounded-xl border border-edu-border bg-edu-background hover:border-edu-state-warning transition-colors">' +
            '<div class="flex items-center gap-2 mb-2">' +
              '<span class="px-2 py-0.5 rounded text-[11px] font-medium bg-edu-state-warning-bg text-edu-state-warning">' + (q.type === 'multi' ? '多选题' : '单选题') + '</span>' +
              '<span class="text-xs text-edu-muted-foreground">' + esc(q.subject) + ' · ' + esc(q.school) + '</span>' +
            '</div>' +
            '<p class="text-sm text-edu-foreground font-medium line-clamp-2">' + esc(q.stem) + '</p>' +
          '</div>';
      }).join('') + '</div>';
    }
    document.getElementById('wp-fav-area').innerHTML = '' +
      '<div class="bg-edu-card border border-edu-border rounded-2xl p-5 md:p-6 shadow-sm">' +
        '<div class="flex items-center gap-2 mb-6">' +
          '<div class="w-8 h-8 rounded-lg bg-edu-state-warning-bg text-edu-state-warning flex items-center justify-center"><i data-lucide="star" class="w-4 h-4"></i></div>' +
          '<h2 class="edu-h3 text-edu-foreground">题目收藏</h2>' +
          '<span class="text-xs text-edu-muted-foreground bg-edu-muted px-2 py-0.5 rounded-full">共 ' + items.length + ' 道</span>' +
        '</div>' + body +
      '</div>';

  /* ---- 智能推荐 ---- */
  function renderWpSmartArea() {
    var recs = state.written.slice(0, 5);
    var hasInterview = planHasInterview(state.plan);
    var cards = recs.map(function (q) {
      return '' +
        '<button type="button" onclick="wpPracticeQuestion(\'' + esc(q.id) + '\')" class="group text-left block p-4 rounded-xl border border-edu-border bg-edu-background hover:border-edu-primary/40 hover:shadow-sm transition-all">' +
          '<div class="flex items-center justify-between mb-2">' +
            '<span class="px-2 py-0.5 rounded text-[11px] font-medium bg-edu-primary-50 text-edu-primary-700">' + esc(q.subject) + '</span>' +
            '<i data-lucide="arrow-right" class="w-4 h-4 text-edu-muted-foreground group-hover:text-edu-primary transition-colors"></i>' +
          '</div>' +
          '<p class="text-sm text-edu-foreground font-medium line-clamp-2">' + esc(q.stem) + '</p>' +
        '</button>';
    }).join('');
    document.getElementById('wp-smart-area').innerHTML = '' +
      '<div class="bg-edu-card border border-edu-border rounded-2xl p-5 md:p-6 shadow-sm">' +
        '<div class="flex items-center gap-2 mb-5">' +
          '<div class="w-8 h-8 rounded-lg bg-edu-primary-50 text-edu-primary flex items-center justify-center"><i data-lucide="lightbulb" class="w-4 h-4"></i></div>' +
          '<h2 class="edu-h3 text-edu-foreground">智能推荐</h2>' +
          '<span class="text-xs text-edu-muted-foreground bg-edu-muted px-2 py-0.5 rounded-full">基于错题本与练习记录</span>' +
        '</div>' +
        '<p class="text-sm text-edu-muted-foreground mb-4">系统根据你方案中的院校专业与错题分布，为你推荐以下同类强化题目' + (hasInterview ? '，面试薄弱项可前往练习中心的面试练习区专项训练。' : '。') + '</p>' +
        '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + cards + '</div>' +
      '</div>';
  }

  /* =======================================================================
     初始化
     ======================================================================= */
  function init() {
    var params = new URLSearchParams(location.search);
    var plan = resolvePlan(params.get('plan'));
    if (!plan) {
      document.getElementById('wp-empty').classList.remove('hidden');
      refreshIcons();
      return;
    }
    state.plan = plan;
    state.written = buildWritten(plan);
    state.papers = groupPapers();

    document.getElementById('wp-main').classList.remove('hidden');
    renderPlanBar();

    /* ?q= 直接进入该题所属试卷并定位；?paper= 直接进入该试卷；否则展示试卷列表 */
    var qid = params.get('q');
    var paperKey = params.get('paper');
    if (qid) {
      var q = state.written.filter(function (x) { return x.id === qid; })[0];
      if (q) enterPaper(q.school + '|' + q.major, qid); else setView('list');
    } else if (paperKey && paperByKey(paperKey)) {
      enterPaper(paperKey, null);
    } else {
      setView('list');
    }
    refreshIcons();
  }
  init();
  lucide.createIcons();
  </script>
</body>
</html>
