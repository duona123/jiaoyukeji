    <style type="text/tailwindcss">
  @theme inline {

  @layer base {
    body { background: var(--edu-background); color: var(--edu-foreground); }
  }

    <style>

      .bg-edu-background{background-color:var(--edu-background);}

      .bg-edu-state-warning-bg{background-color:var(--edu-state-warning-bg);}

      .border-edu-state-warning{border-color:var(--edu-state-warning);}
      .bg-edu-state-error{background-color:var(--edu-state-error);}
      .bg-edu-state-error-bg{background-color:var(--edu-state-error-bg);}
      .text-edu-state-error{color:var(--edu-state-error);}

      .hover\:bg-edu-muted:hover{background-color:var(--edu-muted);}
      .hover\:text-edu-primary:hover{color:var(--edu-primary);}
      .hover\:bg-\[\#0f766e\]:hover{background-color:#0f766e;}
    </style>

<body class="bg-edu-background text-edu-foreground min-h-screen flex flex-col" style="font-family: Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;">

          <a href="written-practice.html" class="mt-6 inline-flex items-center gap-1.5 px-5 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors">

        <div class="flex items-center gap-2 text-edu-primary font-medium">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
          <span>浙招智达</span>
        </div>
        <p class="text-sm text-edu-muted-foreground">© 2026 浙江三一/高职提招智能体 · 让升学更简单</p>

          <a href="#" class="hover:text-edu-primary transition-colors">隐私政策</a>

  <script src="assets/js/practice-core.js?v=20261023c"></script>
  <script>
  /* =======================================================================
     错题练习 / 收藏练习（written-review.html?type=wrong|fav）
     —— 数据来源：全局错题本 / 收藏夹（practice-wrong-book / practice-fav-book）
     —— 答对即从题集移出；也可点「移出错题本 / 取消收藏」主动删除
     ======================================================================= */
  var state = {
    type: 'wrong',
    items: [],
    index: 0,
    selected: [],
    submitted: false,
    correctNow: false
  };

  function kindLabel() { return state.type === 'fav' ? '收藏' : '错题'; }
  function bookVerb() { return state.type === 'fav' ? '取消收藏' : '移出错题本'; }

  function current() { return state.items[state.index] || null; }
  function resolvedCount() { return state.items.filter(function (x) { return x.resolved; }).length; }

  /* ---- 顶部概览 ---- */
  function renderHead() {
    var total = state.items.length;
    var resolved = resolvedCount();
    var remain = total - resolved;
    var pct = total ? Math.round(resolved / total * 100) : 0;
    var isFav = state.type === 'fav';
    document.getElementById('rv-head').innerHTML = '' +
      '<div class="bg-edu-card border border-edu-border rounded-2xl p-5 md:p-6 shadow-sm">' +
        '<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">' +
          '<div class="flex items-center gap-3 min-w-0">' +
            '<div class="w-11 h-11 rounded-xl ' + (isFav ? 'bg-edu-state-warning-bg text-edu-state-warning' : 'bg-edu-state-error-bg text-edu-state-error') + ' flex items-center justify-center shrink-0">' +
              '<i data-lucide="' + (isFav ? 'star' : 'book-x') + '" class="w-5 h-5"></i>' +
            '</div>' +
            '<div class="min-w-0">' +
              '<div class="flex items-center gap-2 flex-wrap">' +
                '<h1 class="edu-h2 text-edu-foreground">' + kindLabel() + '练习</h1>' +
                '<span class="text-xs text-edu-muted-foreground bg-edu-muted px-2 py-0.5 rounded-full">共 <span class="edu-number font-semibold text-edu-foreground">' + total + '</span> 题</span>' +
              '</div>' +
              '<p class="edu-caption text-edu-muted-foreground mt-1">' + (isFav
                ? '答对即自动取消收藏；也可以主动取消收藏。'
                : '答对即自动移出错题本；也可以主动移出。') + '</p>' +
            '</div>' +
          '</div>' +
          '<a href="written-practice.html" class="shrink-0 inline-flex items-center gap-1.5 px-4 h-10 rounded-lg border border-edu-border text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i>返回笔试练习</a>' +
        '</div>' +
        '<div class="mt-5">' +
          '<div class="flex items-center justify-between mb-2">' +
            '<span class="text-sm text-edu-muted-foreground">已掌握 <span class="edu-number font-semibold text-edu-state-success">' + resolved + '</span> 题 · 待攻克 <span class="edu-number font-semibold text-edu-foreground">' + remain + '</span> 题</span>' +
            '<span class="text-sm text-edu-muted-foreground edu-number">' + pct + '%</span>' +
          '</div>' +
          '<div class="h-2.5 w-full rounded-full bg-edu-muted overflow-hidden"><div class="h-full rounded-full bg-edu-state-success transition-all" style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</div>';
  }

  /* ---- 题目卡片 ---- */
  function renderQuestion() {
    var box = document.getElementById('rv-question');
    var q = current();
    var isFav = state.type === 'fav';
    if (!q) {
      box.innerHTML = '' +
        '<div class="bg-edu-card border border-edu-border rounded-2xl p-10 text-center shadow-sm">' +
          '<div class="w-14 h-14 mx-auto rounded-2xl bg-edu-state-success-bg text-edu-state-success flex items-center justify-center mb-4"><i data-lucide="check-circle-2" class="w-7 h-7"></i></div>' +
          '<h2 class="edu-h2 text-edu-foreground">' + (isFav ? '收藏题目已全部完成' : '错题已全部掌握') + '</h2>' +
          '<p class="edu-body text-edu-muted-foreground mt-3">' + (isFav ? '本次收藏练习已清空，可在笔试练习中继续收藏新题目。' : '本次错题已全部答对或移出，继续保持。') + '</p>' +
          '<a href="written-practice.html" class="mt-6 inline-flex items-center gap-1.5 px-5 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i>返回笔试练习</a>' +
        '</div>';
      refreshIcons();
      return;
    }

    var isMulti = q.type === 'multi';
    var typeLabel = isMulti ? '多选题' : '单选题';
    var diffLabel = q.difficulty === '易' ? '简单' : (q.difficulty === '难' ? '困难' : '中等');

    var optionsHtml = q.options.map(function (o) {
      var checked = state.selected.indexOf(o.k) >= 0;
      var cls = 'border-edu-border bg-edu-background hover:border-edu-primary/40';
      if (state.submitted) {
        if (q.answer.indexOf(o.k) >= 0) cls = 'border-edu-state-success bg-edu-state-success-bg';
        else if (checked) cls = 'border-edu-state-error bg-edu-state-error-bg';
      } else if (checked) {
        cls = 'border-edu-primary bg-edu-primary-50';
      }
      return '' +
        '<label class="group flex items-start gap-4 p-4 rounded-xl border ' + cls + ' transition-colors ' + (state.submitted ? '' : 'cursor-pointer') + '">' +
          '<span class="mt-0.5 w-6 h-6 ' + (isMulti ? 'rounded-md' : 'rounded-full') + ' border-2 border-edu-border bg-edu-card flex items-center justify-center text-xs font-semibold text-edu-muted-foreground shrink-0">' + o.k + '</span>' +
          '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="rvopt" value="' + o.k + '" class="sr-only" ' + (checked ? 'checked' : '') + ' ' + (state.submitted ? 'disabled' : '') + '>' +
          '<span class="flex-1 edu-body text-edu-foreground">' + esc(o.t) + '</span>' +
          (state.submitted && q.answer.indexOf(o.k) >= 0 ? '<i data-lucide="check" class="w-5 h-5 text-edu-state-success shrink-0"></i>' : '') +
        '</label>';
    }).join('');

    var feedback = '';
    if (state.submitted) {
      var ok = state.correctNow;
      feedback = '' +
        '<div class="mt-6 rounded-xl border p-5 ' + (ok ? 'border-edu-state-success bg-edu-state-success-bg' : 'border-edu-state-error bg-edu-state-error-bg') + '">' +
          '<div class="flex items-start gap-3 mb-3">' +
            '<div class="w-6 h-6 rounded-full ' + (ok ? 'bg-edu-state-success' : 'bg-edu-state-error') + ' text-white flex items-center justify-center shrink-0"><i data-lucide="' + (ok ? 'check' : 'x') + '" class="w-4 h-4"></i></div>' +
            '<div>' +
              '<p class="font-semibold text-edu-foreground">' + (ok ? '回答正确' : '回答错误') + '</p>' +
              '<p class="edu-body-sm text-edu-muted-foreground mt-0.5">' + (ok
                ? '已自动从' + (isFav ? '收藏练习' : '错题本') + '中移出。'
                : '本题仍保留在' + (isFav ? '收藏练习' : '错题本') + '中，可稍后重做。') +
                '　正确答案：<span class="font-medium text-edu-state-success">' + q.answer.join('、') + '</span></p>' +
            '</div>' +
          '</div>' +
          '<div class="pl-9 space-y-3">' +
            '<div><p class="text-sm font-semibold text-edu-foreground mb-1">详细解析</p><p class="edu-body-sm text-edu-muted-foreground leading-relaxed">' + esc(q.analysis) + '</p></div>' +
            '<div><p class="text-sm font-semibold text-edu-foreground mb-1">解题思路</p><p class="edu-body-sm text-edu-muted-foreground leading-relaxed">' + esc(q.tips) + '</p></div>' +
          '</div>' +
        '</div>';
    }

    var submitBtn = state.submitted
      ? '<button type="button" onclick="resetQuestion()" class="px-6 h-11 rounded-lg border border-edu-border bg-edu-card text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors">重做本题</button>'
      : '<button type="button" onclick="submitAnswer()" class="px-6 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors">提交答案</button>';

    box.innerHTML = '' +
      '<div class="bg-edu-card border border-edu-border rounded-xl p-6 md:p-8 shadow-sm">' +
        '<div class="flex flex-wrap items-center gap-3 mb-5">' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-primary-50 text-edu-primary-700 text-xs font-medium"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>' + esc(q.subject) + '</span>' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="layers" class="w-3.5 h-3.5"></i>' + typeLabel + '</span>' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i>' + diffLabel + '</span>' +
          (q.school ? '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-state-info-bg text-edu-state-info text-xs font-medium"><i data-lucide="school" class="w-3.5 h-3.5"></i>' + esc(q.school) + '</span>' : '') +
          (q.resolved ? '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-state-success-bg text-edu-state-success text-xs font-medium"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>已' + (isFav ? '取消收藏' : '移出错题本') + '</span>' : '') +
          '<span class="ml-auto edu-caption text-edu-muted-foreground">第 <span class="edu-number text-edu-foreground font-medium">' + (state.index + 1) + '</span> 题 / 共 <span class="edu-number text-edu-foreground font-medium">' + state.items.length + '</span> 题</span>' +
        '</div>' +
        '<h2 class="edu-h3 text-edu-foreground mb-3">【' + typeLabel + '】' + esc(q.stem) + '</h2>' +
        (isMulti ? '<p class="edu-caption text-edu-muted-foreground mb-3">多选题：请选出所有正确选项。</p>' : '') +
        '<div class="space-y-3 mb-6">' + optionsHtml + '</div>' +
        '<div class="flex flex-wrap items-center gap-3 mb-6">' + submitBtn +
          '<button type="button" onclick="removeCurrent()" class="inline-flex items-center gap-1.5 px-4 h-11 rounded-lg border border-edu-state-error text-edu-state-error text-sm font-medium hover:bg-edu-state-error-bg transition-colors"><i data-lucide="' + (isFav ? 'star-off' : 'trash-2') + '" class="w-4 h-4"></i>' + bookVerb() + '</button>' +
          (!state.submitted ? '<span class="edu-caption text-edu-muted-foreground">作答后点击提交查看解析</span>' : '') +
        '</div>' +
        feedback +
        '<div class="mt-6 flex flex-wrap gap-2">' +
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-edu-muted text-edu-muted-foreground text-xs font-medium"><i data-lucide="tag" class="w-3.5 h-3.5"></i>来源：' + esc(q.school || '题库') + (q.major ? ' · ' + esc(q.major) : '') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="mt-6 bg-edu-card border border-edu-border rounded-xl p-5 shadow-sm">' +
        '<div class="flex items-center justify-between gap-3">' +
          '<span class="text-sm text-edu-muted-foreground">已掌握 <span class="edu-number font-semibold text-edu-state-success">' + resolvedCount() + '</span> / ' + state.items.length + ' 题</span>' +
          '<div class="flex items-center gap-3">' +
            '<button type="button" onclick="prevQuestion()" class="px-5 h-11 rounded-lg border border-edu-border bg-edu-card text-edu-foreground text-sm font-medium hover:bg-edu-muted transition-colors inline-flex items-center gap-1.5"><i data-lucide="arrow-left" class="w-4 h-4"></i>上一题</button>' +
            '<button type="button" onclick="nextQuestion()" class="px-5 h-11 rounded-lg bg-edu-primary text-white text-sm font-medium hover:bg-[#0f766e] transition-colors inline-flex items-center gap-1.5">下一题<i data-lucide="arrow-right" class="w-4 h-4"></i></button>' +
          '</div>' +
        '</div>' +
      '</div>';

    box.querySelectorAll('input[name="rvopt"]').forEach(function (input) {
      input.addEventListener('change', function () {
        var v = this.value;
        if (isMulti) {
          var i = state.selected.indexOf(v);
          if (i >= 0) state.selected.splice(i, 1); else state.selected.push(v);
        } else {
          state.selected = [v];
        }
        renderQuestion();
        refreshIcons();
      });
    });
    refreshIcons();
  }

  function render() {
    if (!state.items.length) {
      document.getElementById('rv-main').classList.add('hidden');
      document.getElementById('rv-empty').classList.remove('hidden');
      refreshIcons();
      return;
    }
    document.getElementById('rv-empty').classList.add('hidden');
    document.getElementById('rv-main').classList.remove('hidden');
    renderHead();
    renderQuestion();
  }

  function submitAnswer() {
    if (!state.selected.length) { alert('请先选择答案'); return; }
    var q = current();
    if (!q) return;
    var ok = state.selected.slice().sort().join(',') === q.answer.slice().sort().join(',');
    state.submitted = true;
    state.correctNow = ok;
    if (ok) {
      removeFromBook(state.type, q.key);
      q.resolved = true;
    }
    render();
  }

  function resetQuestion() {
    state.submitted = false;
    state.selected = [];
    state.correctNow = false;
    render();
  }

  function removeCurrent() {
    var q = current();
    if (!q) return;
    if (!confirm('确定将此题' + (state.type === 'fav' ? '取消收藏' : '移出错题本') + '吗？')) return;
    removeFromBook(state.type, q.key);
    state.items.splice(state.index, 1);
    if (state.index >= state.items.length) state.index = Math.max(0, state.items.length - 1);
    state.submitted = false;
    state.selected = [];
    state.correctNow = false;
    render();
  }

  function nextQuestion() {
    if (state.index < state.items.length - 1) {
      state.index++;
      state.submitted = false;
      state.selected = [];
      state.correctNow = false;
      render();
    }
  }
  function prevQuestion() {
    if (state.index > 0) {
      state.index--;
      state.submitted = false;
      state.selected = [];
      state.correctNow = false;
      render();
    }
  }

  function init() {
    var params = new URLSearchParams(location.search);
    state.type = params.get('type') === 'fav' ? 'fav' : 'wrong';
    var isFav = state.type === 'fav';
    document.title = (isFav ? '收藏练习' : '错题练习') + ' · 笔试练习';
    var items = bookList(state.type).map(function (q) {
      return { key: q.key, type: q.type, subject: q.subject, difficulty: q.difficulty, stem: q.stem, options: q.options, answer: q.answer, analysis: q.analysis, tips: q.tips, school: q.school, major: q.major, resolved: false };
    });
    state.items = items;
    if (!items.length) {
      document.getElementById('rv-empty-title').textContent = isFav ? '暂无收藏题目' : '错题已全部掌握';
      document.getElementById('rv-empty-desc').textContent = isFav
        ? '还没有收藏的题目，在笔试练习中点击题目右上角「收藏」即可加入收藏练习。'
        : '当前没有需要练习的错题，继续保持。练习中答错的题目会自动收录到错题本。';
      if (isFav) {
        var icon = document.getElementById('rv-empty-icon');
        icon.className = 'w-14 h-14 mx-auto rounded-2xl bg-edu-state-warning-bg text-edu-state-warning flex items-center justify-center mb-4';
        icon.innerHTML = '<i data-lucide="star" class="w-7 h-7"></i>';
      }
    }
    render();
  }
  init();
  lucide.createIcons();
  </script>
</body>
</html>
